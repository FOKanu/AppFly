[project]
name = "jobhunt"
version = "0.1.0"
description = "Local job-hunt copilot that writes into an Obsidian vault"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.129",
    "starlette>=0.38,<1",
    "feedparser>=6.0",
    "google-genai>=1.0",
    "httpx>=0.27",
    "keyring>=25.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "python-frontmatter>=1.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "sentence-transformers>=3.0",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
extract = ["pypdf>=5.0", "python-docx>=1.1"]

[project.scripts]
jobhunt = "jobhunt.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Classic pyflakes + syntax/import errors only; keep in sync with the pinned ruff in .github/workflows/ci.yml.
select = ["E4", "E7", "E9", "F"]
