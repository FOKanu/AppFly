name: CI

on:
  pull_request:
    branches:
      - main
      - integrate/*
  push:
    branches:
      - main
      - integrate/*

# Cancel in-progress runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: read-only by default
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pin from pyproject.toml requires-python >= 3.12
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,extract]"
      
      - name: Lint (ruff, classic rules from pyproject)
        run: |
          pip install ruff==0.16.10
          ruff check .

      - name: Run tests
        run: pytest
        # Tests use temp paths and in-memory keychains (see conftest.py)
        # No real API keys needed - tests skip network calls

  frontend:
    name: Frontend (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 LTS — jsdom 30 / undici need markAsUncloneable (not on Node 20)
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test
        # Vitest + Testing Library (F3). Does not hit live APIs or crawl boards.
      
      - name: Build + bundle secret scan
        run: npm run build:secure
        # build:secure = tsc --noEmit && vite build && scan-bundle-secrets (M8)
        # Catches TypeScript errors, build failures, and secret-shaped tokens in dist/

  desktop:
    name: Desktop (prepare-resources)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Prepare resources
        # Builds the UI into desktop/.ui-dist and runs the bundle secret scan; Neutralino binaries are not needed.
        run: npm run prepare-resources
        working-directory: desktop
