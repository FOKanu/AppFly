name: CI

on:
  pull_request:
    branches:
      - main
      - integrate/*
  push:
    branches:
      - main
      - integrate/*

# Cancel in-progress runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: read-only by default
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pin from pyproject.toml requires-python >= 3.12
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run tests
        run: pytest
        # Tests use temp paths and in-memory keychains (see conftest.py)
        # No real API keys needed - tests skip network calls

  frontend:
    name: Frontend (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 LTS — jsdom 30 / undici need markAsUncloneable (not on Node 20)
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test
        # Vitest + Testing Library (F3). Does not hit live APIs or crawl boards.
      
      - name: Build (includes type-checking)
        run: npm run build
        # Build script: "tsc --noEmit && vite build"
        # This catches TypeScript errors and ensures production build succeeds
